name: update-schedule

on:
  schedule:
    - cron: "0 21 * * *"   # 毎日 06:00 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scrape venues
        # 1会場でも失敗すると終了コード1になるが、取れた分はコミットしたいので続行する
        run: python3 scrape.py || echo "::warning::一部の会場の取得に失敗しました"
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json data/events.js
          git diff --cached --quiet || git commit -m "data: update schedule"
          git push
