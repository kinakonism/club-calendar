<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0a0a">
<title>Club Calendar</title>
<style>
:root {
  --bg: #0a0a0a; --hover: #151515; --line: #262626; --line-2: #3a3a3a;
  --text: #e9e9e9; --muted: #838383; --accent: #19e3ff; --ink: #000;
  --asia: #ff3b3b; --circus: #ffd23f; --zero: #9b8cff; --womb: #3ddc84; --vent: #ff7ad9; --dommune: #ff8a3d;
  --rdc: #c6f432; --live: #9a9a9a; --other: #9a9a9a;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--bg); }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.5 "Helvetica Neue", Helvetica, Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
  font-variant-numeric: tabular-nums;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: left; }
a { color: inherit; }
:focus-visible { outline: 1px solid var(--text); outline-offset: 1px; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px 80px; }

header.top { display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap; padding: 18px 0 12px; border-bottom: 1px solid var(--text); }
header.top h1 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: .14em; }
header.top .meta { color: var(--muted); font-size: 12px; }
header.top nav { margin-left: auto; display: flex; gap: 16px; }
.link { font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }
.link:hover { color: var(--accent); }
.warn { margin-top: 10px; padding: 8px 10px; border: 1px solid var(--asia); color: var(--asia); font-size: 13px; }

h2 { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 34px 0 0; padding-bottom: 7px; font-size: 13px; font-weight: 700; border-bottom: 1px solid var(--line-2); }
h2 small { font-weight: 400; color: var(--muted); font-size: 12px; }

/* event rows */
.row { display: grid; grid-template-columns: 84px 150px minmax(0, 1fr) 56px; gap: 12px; align-items: baseline; width: 100%; padding: 9px 4px; border-bottom: 1px solid var(--line); }
.row:hover { background: var(--hover); }
.row .d { white-space: nowrap; }
.row .d small { color: var(--muted); font-size: 12px; margin-left: 4px; }
.row .v { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sq { display: inline-block; width: 8px; height: 8px; background: var(--vc, var(--other)); margin-right: 7px; }
.row .t { font-weight: 700; overflow-wrap: anywhere; }
.row .hit { color: var(--accent); font-size: 12.5px; }
.row .a { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .o { color: var(--muted); font-size: 12.5px; text-align: right; white-space: nowrap; }
.new { color: var(--accent); font-size: 11px; font-weight: 700; margin-left: 8px; letter-spacing: .06em; }
.empty { color: var(--muted); padding: 14px 4px; border-bottom: 1px solid var(--line); font-size: 13px; }
.more { margin-top: 10px; }
@media (max-width: 640px) {
  .row { grid-template-columns: auto minmax(0, 1fr) auto; row-gap: 2px; column-gap: 10px; }
  .row .m { grid-column: 1 / -1; grid-row: 2; }
  .row .o { grid-column: 3; grid-row: 1; }
}

.btn { border: 1px solid var(--line-2); padding: 6px 12px; font-size: 13px; text-align: center; }
.btn:hover { border-color: var(--text); }
.btn.primary { background: var(--text); color: var(--ink); border-color: var(--text); font-weight: 700; text-decoration: none; display: inline-block; }
.btn.primary:hover { background: var(--accent); border-color: var(--accent); }

/* toolbar */
.toolbar { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 12px 0; }
.toolbar .month { font-size: 18px; font-weight: 700; min-width: 5.4em; text-align: center; }
.toolbar .nav { display: flex; align-items: center; gap: 6px; }
.filters { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; padding-bottom: 12px; }
.filters .grp { color: var(--muted); }
.chip { color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.chip::before { content: ""; width: 9px; height: 9px; border: 1px solid var(--vc, var(--muted)); }
.chip[aria-pressed="true"] { color: var(--text); }
.chip[aria-pressed="true"]::before { background: var(--vc, var(--text)); }
.chip:hover { color: var(--text); }

/* calendar */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--line-2); border-left: 1px solid var(--line); }
.dow { text-align: center; font-size: 11px; color: var(--muted); padding: 5px 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.day { min-height: 108px; padding: 4px 4px 6px; display: flex; flex-direction: column; gap: 2px; min-width: 0; cursor: pointer; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.day:hover { background: var(--hover); }
.day.out .num, .day.out .ev { opacity: .3; }
.day.past .ev { color: var(--muted); }
.day .num { font-size: 12px; color: var(--muted); align-self: flex-start; padding: 0 4px; }
.day.today .num { background: var(--text); color: var(--ink); font-weight: 700; }
.day.sel { box-shadow: inset 0 0 0 1px var(--text); }
.ev { display: block; width: 100%; font-size: 11.5px; line-height: 1.35; padding: 0 0 0 5px; border-left: 2px solid var(--vc, var(--other)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ev:hover { text-decoration: underline; }
.ev.hit { color: var(--accent); font-weight: 700; }
.day .rest { font-size: 11px; color: var(--muted); padding-left: 7px; }
.day .rest:hover { color: var(--text); }
.dots { display: none; flex-wrap: wrap; gap: 3px; justify-content: center; padding-top: 2px; }
.dot { width: 6px; height: 6px; background: var(--vc, var(--other)); }
.dot.hit { background: var(--accent); outline: 1px solid var(--accent); outline-offset: 1px; }
@media (max-width: 760px) {
  .day { min-height: 54px; align-items: center; padding: 4px 1px; }
  .day .num { align-self: center; }
  .ev, .day .rest { display: none; }
  .dots { display: flex; }
}

/* dialogs */
dialog { border: 1px solid var(--line-2); background: var(--bg); color: var(--text); padding: 0; width: min(620px, calc(100vw - 20px)); max-height: calc(100dvh - 28px); }
dialog::backdrop { background: rgba(0, 0, 0, .78); }
.dlg { padding: 18px 18px 20px; }
.dlg .sub { color: var(--muted); font-size: 12.5px; }
.dlg h3 { margin: 6px 0 4px; font-size: 20px; line-height: 1.3; overflow-wrap: anywhere; }
.dlg h4 { font-size: 12px; font-weight: 700; margin: 20px 0 8px; padding-bottom: 5px; border-bottom: 1px solid var(--line); }
.picks { display: flex; flex-wrap: wrap; gap: 5px; }
.pick { border: 1px solid var(--line-2); padding: 3px 9px; font-size: 13px; max-width: 100%; overflow-wrap: anywhere; }
.pick:hover { border-color: var(--text); }
.pick[aria-pressed="true"] { background: var(--accent); color: var(--ink); border-color: var(--accent); font-weight: 700; }
.pick[aria-pressed="true"]::before { content: "★ "; }
.pick.locked, .pick.label { cursor: default; }
.pick .lb { color: var(--muted); font-size: 11.5px; }
.pick[aria-pressed="true"] .lb { color: var(--ink); }
.dlg pre { white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; font-size: 12.5px; color: var(--muted); border: 1px solid var(--line); padding: 10px; margin: 8px 0 0; max-height: 240px; overflow: auto; }
.dlg details summary { cursor: pointer; color: var(--muted); font-size: 12.5px; margin-top: 16px; }
.dlg .foot { display: flex; gap: 8px; justify-content: space-between; align-items: center; margin-top: 20px; flex-wrap: wrap; }
.hint { color: var(--muted); font-size: 12.5px; }
.addrow { display: flex; gap: 6px; margin-bottom: 8px; }
.addrow input, .dlg textarea, .dlg select, .field input { flex: 1; min-width: 0; width: 100%; background: transparent; border: 1px solid var(--line-2); padding: 7px 9px; border-radius: 0; }
.dlg textarea { min-height: 96px; resize: vertical; }
.dlg textarea.code { font: 12px/1.4 ui-monospace, Menlo, monospace; }
.field { margin-top: 12px; }
.field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.radios { display: flex; flex-wrap: wrap; gap: 5px; }
.sugg { margin-top: 8px; }
.sugg .pick { font-size: 12px; padding: 1px 7px; color: var(--muted); }
@media (max-width: 560px) { dialog { width: 100vw; max-width: 100vw; margin: auto 0 0; border-width: 1px 0 0; max-height: 90dvh; } }
footer { margin-top: 48px; color: var(--muted); font-size: 11.5px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>CLUB CALENDAR</h1>
    <span class="meta" id="updated"></span>
    <nav>
      <button class="link" id="openPrefs">好みを設定</button>
      <button class="link" id="openReq">追加リクエスト</button>
    </nav>
  </header>
  <div id="warnings"></div>

  <h2><span id="heroTitle">今夜</span><small id="heroNote"></small></h2>
  <div id="hero"></div>

  <h2>あなた向け<small id="forYouNote"></small></h2>
  <div id="forYou"></div>

  <h2>新着<small>直近7日間に追加</small></h2>
  <div id="fresh"></div>

  <h2>カレンダー<small>イベント名で詳細、日付でその日の一覧</small></h2>
  <div class="toolbar">
    <div class="nav">
      <button class="btn" id="prev" aria-label="前の月">←</button>
      <div class="month" id="monthLabel"></div>
      <button class="btn" id="next" aria-label="次の月">→</button>
      <button class="btn" id="todayBtn">今日</button>
    </div>
  </div>
  <div class="filters" id="filters"></div>
  <div class="cal" id="cal"></div>

  <h2><span id="dayTitle"></span></h2>
  <div id="dayList"></div>

  <footer>各会場の公式サイトの掲載情報を1日1回まとめた個人用ページ。出演者は自動抽出のため誤りを含むことがあります。正確な情報は各イベントの公式ページで確認してください。</footer>
</div>

<dialog id="eventDlg"><div class="dlg" id="eventBody"></div></dialog>
<dialog id="prefsDlg"><div class="dlg" id="prefsBody"></div></dialog>
<dialog id="reqDlg"><div class="dlg" id="reqBody"></div></dialog>

<script src="data/events.js"></script>
<script>
"use strict";
const DATA = window.CLUB_DATA || { events: [], sources: {}, updated: "" };
// live: true の会場は邦楽ライブなども多いので、既定ではフォロー中のアーティスト・レーベルに一致したものだけ出す
const VENUES = {
  asia:    { name: "club asia",          color: "var(--asia)" },
  circus:  { name: "CIRCUS Tokyo",       color: "var(--circus)" },
  zero:    { name: "ZERO TOKYO",         color: "var(--zero)" },
  womb:    { name: "WOMB",               color: "var(--womb)" },
  vent:    { name: "VENT",               color: "var(--vent)" },
  dommune: { name: "DOMMUNE",            color: "var(--dommune)" },
  rdc:     { name: "Rainbow Disco Club", color: "var(--rdc)" },
  liquid:  { name: "LIQUIDROOM",         color: "var(--live)", live: true },
  unit:    { name: "UNIT",               color: "var(--live)", live: true },
  www:     { name: "WWW / WWW X",        color: "var(--live)", live: true },
  oeast:   { name: "Spotify O-EAST",     color: "var(--live)", live: true },
};
const DOW = ["日", "月", "火", "水", "木", "金", "土"];
const STORE = "club-calendar:v1";

// ---------- tiny DOM helper (スクレイピングした文字列は必ず textContent 経由で入れる)
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "style") el.style.cssText = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  fill(el, kids);
  return el;
}
// 入れ子の配列や null を許す replaceChildren（素の replaceChildren は null を "null" と描いてしまう）
function fill(el, ...kids) {
  el.replaceChildren(...kids.flat(Infinity).filter(k => k != null && k !== false));
  return el;
}
const norm = s => String(s || "").normalize("NFKC").toLowerCase().replace(/[’`]/g, "'").replace(/\s+/g, " ").trim();
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
// 日本時間の「今日」。深夜イベント中（朝6時まで）は前日扱いにして、今夜の分が過去に落ちないようにする
const TODAY = (() => {
  const p = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Tokyo", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", hourCycle: "h23" })
    .formatToParts(new Date()).reduce((a, x) => (a[x.type] = x.value, a), {});
  const d = new Date(+p.year, +p.month - 1, +p.day);
  if (+p.hour < 6) d.setDate(d.getDate() - 1);
  return iso(d);
})();
const fmtDay = s => { const d = parse(s); return `${d.getMonth() + 1}/${d.getDate()}(${DOW[d.getDay()]})`; };
const vcolor = v => (VENUES[v] || {}).color || "var(--other)";
const vname = e => e.venue_name || (VENUES[e.venue] || {}).name || e.venue;
const isLive = v => !!(VENUES[v] || {}).live;

// ---------- state
const state = { prefs: { artists: [], keywords: [], genres: [] }, venues: {}, onlyHits: false, month: TODAY.slice(0, 7), sel: TODAY };
try {
  const saved = JSON.parse(localStorage.getItem(STORE) || "null");
  if (saved && saved.prefs) for (const k of ["artists", "keywords", "genres"]) if (Array.isArray(saved.prefs[k])) state.prefs[k] = saved.prefs[k].map(String);
  if (saved && saved.venues) state.venues = saved.venues;
} catch (_) { /* 保存領域が使えなくても表示はできる */ }
function save() {
  try { localStorage.setItem(STORE, JSON.stringify({ prefs: state.prefs, venues: state.venues })); } catch (_) {}
}
// リポジトリ側（data/follow.json）で固定フォローしているアーティスト・レーベルと、レーベルの所属アーティスト
const FOLLOW = { artists: (DATA.follow && DATA.follow.artists) || [], labels: (DATA.follow && DATA.follow.labels) || [] };
const ROSTERS = FOLLOW.labels.map(l => [l, new Set(((DATA.labels || {})[l] || []).map(norm).filter(n => n.length >= 3))]);
const isFollowed = v => FOLLOW.artists.some(x => norm(x) === norm(v));
const labelsOf = v => ROSTERS.filter(([, set]) => set.has(norm(v))).map(([l]) => l);
const has = (kind, v) => state.prefs[kind].some(x => norm(x) === norm(v)) || (kind === "artists" && isFollowed(v));
function toggle(kind, v) {
  if (kind === "artists" && isFollowed(v)) return; // follow.json 側の登録は画面からは外せない
  if (has(kind, v)) state.prefs[kind] = state.prefs[kind].filter(x => norm(x) !== norm(v));
  else state.prefs[kind].push(String(v).trim());
  save(); computeMatches(); renderAll();
}

// ---------- matching
const EVENTS = DATA.events.map(e => ({ ...e, last: e.end_date || e.date }));
for (const e of EVENTS) {
  e._lineup = (e.lineup || []).map(norm);
  e._genres = (e.genres || []).map(norm);
  e._hay = norm([e.title, (e.lineup || []).join("\n"), e.text].join("\n"));
}
// 「Can」のような短い名前が他の単語の一部に当たらないよう、英数字の境界を見る
const wordRe = s => new RegExp("(?<![a-z0-9])" + escRe(norm(s)) + "(?![a-z0-9])");
function computeMatches() {
  const allArtists = [...FOLLOW.artists, ...state.prefs.artists.filter(x => !isFollowed(x))];
  const A = allArtists.filter(x => norm(x)).map(x => [x, norm(x), wordRe(x)]);
  const L = ROSTERS.map(([l, set]) => [l, set, wordRe(l)]);
  const K = state.prefs.keywords.filter(x => norm(x)).map(x => [x, wordRe(x)]);
  const G = state.prefs.genres.map(norm).filter(Boolean);
  for (const e of EVENTS) {
    e.hits = [];
    for (const [raw, n, re] of A) if (e._lineup.includes(n) || re.test(e._hay)) e.hits.push({ kind: "artist", label: raw, w: 10 });
    for (const [l, set, re] of L) {
      const acts = (e.lineup || []).filter((a, i) => set.has(e._lineup[i]) && !e.hits.some(x => x.kind === "artist" && norm(x.label) === e._lineup[i]));
      for (const a of acts.slice(0, 3)) e.hits.push({ kind: "label", label: `${l}: ${a}`, w: 8 });
      // ライブ会場は「WARP」を含む無関係な公演名が多いので、レーベル名そのものの一致はクラブ側だけで見る
      if (!acts.length && !isLive(e.venue) && re.test(e._hay)) e.hits.push({ kind: "label", label: l, w: 5 });
    }
    for (const [raw, re] of K) if (re.test(e._hay)) e.hits.push({ kind: "keyword", label: raw, w: 5 });
    (e.genres || []).forEach((g, i) => { if (G.includes(e._genres[i])) e.hits.push({ kind: "genre", label: g, w: 2 }); });
    e.score = e.hits.reduce((s, x) => s + x.w, 0);
    e.strong = e.hits.some(x => x.kind !== "genre");
  }
}
const isNew = e => {
  if (!e.first_seen) return false;
  return (parse(TODAY) - parse(e.first_seen)) / 864e5 <= 7;
};
// クラブ: チェックを外すと非表示。ライブ会場: 既定は「一致したものだけ」、チェックを入れると全件。
const venueOn = v => isLive(v) ? state.venues[v] === true : state.venues[v] !== false;
const inScope = e => isLive(e.venue) ? (venueOn(e.venue) || e.strong) : venueOn(e.venue);
const upcoming = () => EVENTS.filter(e => e.last >= TODAY && inScope(e));
const visible = e => inScope(e) && (!state.onlyHits || e.score > 0);

// ---------- rendering
function row(e) {
  const d = parse(e.date);
  const dateText = e.end_date && e.end_date !== e.date ? `${d.getMonth() + 1}/${d.getDate()}–${parse(e.end_date).getDate()}` : `${d.getMonth() + 1}/${d.getDate()}`;
  const acts = (e.lineup || []).slice(0, 12).join(" / ");
  return h("button", { class: "row", style: `--vc:${vcolor(e.venue)}`, onclick: () => openEvent(e) },
    h("span", { class: "d" }, dateText, h("small", {}, DOW[d.getDay()])),
    h("span", { class: "v" }, h("span", { class: "sq" }), vname(e)),
    h("span", { class: "m" },
      h("div", { class: "t" }, e.title, isNew(e) ? h("span", { class: "new" }, "NEW") : null),
      e.hits.length ? h("div", { class: "hit" }, e.hits.slice(0, 6).map(x => (x.kind === "artist" ? "★ " : "") + x.label).join("　")) : null,
      acts ? h("div", { class: "a" }, acts) : null),
    h("span", { class: "o" }, e.open || ""));
}
function rowList(list, limit, emptyText) {
  const box = h("div", {});
  if (!list.length) { box.append(h("div", { class: "empty" }, emptyText)); return box; }
  const rows = h("div", {}, list.slice(0, limit).map(row));
  box.append(rows);
  if (list.length > limit) {
    const b = h("button", { class: "btn more", onclick: () => { fill(rows, list.map(row)); b.remove(); } }, `残り ${list.length - limit} 件を表示`);
    box.append(b);
  }
  return box;
}
function renderHero() {
  const up = upcoming();
  const tonight = up.filter(e => e.date <= TODAY);
  const day = tonight.length ? TODAY : (up.map(e => e.date).sort()[0] || TODAY);
  const list = up.filter(e => e.date <= day && day <= e.last).sort((a, b) => b.score - a.score || a.venue.localeCompare(b.venue));
  document.getElementById("heroTitle").textContent = tonight.length ? "今夜" : "次の開催日";
  document.getElementById("heroNote").textContent = `${fmtDay(day)}・${list.length}件`;
  fill(document.getElementById("hero"), rowList(list, 10, "掲載イベントはありません。"));
}
function renderTop() {
  const n = state.prefs.artists.length + state.prefs.keywords.length + state.prefs.genres.length + FOLLOW.artists.length + FOLLOW.labels.length;
  const up = upcoming();
  const mine = up.filter(e => e.score > 0).sort((a, b) => (b.strong - a.strong) || a.date.localeCompare(b.date) || b.score - a.score);
  document.getElementById("forYouNote").textContent = n ? `${mine.length}件・アーティスト／レーベル一致を先に表示` : "";
  fill(document.getElementById("forYou"), rowList(mine, 10,
    n ? "登録している好みに一致する今後のイベントはありません。" :
        "好みが未登録です。イベントを開いて出演者やジャンルを押すと★が付き、一致するイベントがここに並びます。"));
  const fresh = up.filter(isNew).sort((a, b) => b.score - a.score || (b.first_seen || "").localeCompare(a.first_seen || "") || a.date.localeCompare(b.date));
  fill(document.getElementById("fresh"), rowList(fresh, 8, "直近7日間に追加されたイベントはありません。"));
}
function eventsOn(day) { return EVENTS.filter(e => e.date <= day && day <= e.last && visible(e)).sort((a, b) => b.score - a.score || isLive(a.venue) - isLive(b.venue) || a.venue.localeCompare(b.venue)); }
function renderCal() {
  const [y, m] = state.month.split("-").map(Number);
  document.getElementById("monthLabel").textContent = `${y}年${m}月`;
  const first = new Date(y, m - 1, 1);
  const start = new Date(first); start.setDate(1 - ((first.getDay() + 6) % 7)); // 月曜始まり（金土日を並べる）
  const cells = ["月", "火", "水", "木", "金", "土", "日"].map(d => h("div", { class: "dow" }, d));
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const key = iso(d), list = eventsOn(key);
    if (i === 35 && d.getMonth() !== m - 1) break;
    const cls = ["day", d.getMonth() !== m - 1 && "out", key === TODAY && "today", key < TODAY && "past", key === state.sel && "sel"].filter(Boolean).join(" ");
    const pickDay = () => { state.sel = key; renderCal(); renderDay(); };
    cells.push(h("div", { class: cls, role: "button", tabindex: "0", "aria-label": `${fmtDay(key)} ${list.length}件`, onclick: pickDay,
      onkeydown: ev => { if (ev.target === ev.currentTarget && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); pickDay(); } } },
      h("span", { class: "num" }, String(d.getDate())),
      list.slice(0, 4).map(e => h("button", { class: "ev" + (e.score > 0 ? " hit" : ""), style: `--vc:${vcolor(e.venue)}`, title: `${vname(e)} / ${e.title}`,
        onclick: ev => { ev.stopPropagation(); if (state.sel !== key) { state.sel = key; renderCal(); renderDay(); } openEvent(e); } }, e.title)),
      list.length > 4 ? h("span", { class: "rest", onclick: ev => { ev.stopPropagation(); pickDay(); document.getElementById("dayTitle").scrollIntoView({ behavior: "smooth", block: "start" }); } }, `ほか${list.length - 4}件`) : null,
      h("span", { class: "dots" }, list.slice(0, 8).map(e => h("span", { class: "dot" + (e.score > 0 ? " hit" : ""), style: `--vc:${vcolor(e.venue)}` })))));
  }
  fill(document.getElementById("cal"), cells);
}
function renderDay() {
  const list = eventsOn(state.sel);
  document.getElementById("dayTitle").textContent = `${fmtDay(state.sel)} のイベント`;
  fill(document.getElementById("dayList"), rowList(list, 40, "この日の掲載イベントはありません。"));
}
function renderFilters() {
  const present = Object.keys(VENUES).filter(v => EVENTS.some(e => e.venue === v));
  const chip = v => h("button", { class: "chip", style: `--vc:${vcolor(v)}`, "aria-pressed": String(venueOn(v)),
    onclick: () => { state.venues[v] = !venueOn(v); save(); renderAll(); } }, VENUES[v].name);
  const live = present.filter(isLive);
  fill(document.getElementById("filters"),
    present.filter(v => !isLive(v)).map(chip),
    live.length ? [h("span", { class: "grp" }, "｜ライブ会場（未チェックは一致のみ表示）"), live.map(chip)] : null,
    h("span", { class: "grp" }, "｜"),
    h("button", { class: "chip", "aria-pressed": String(state.onlyHits), onclick: () => { state.onlyHits = !state.onlyHits; renderAll(); } }, "好みに一致だけ"));
}
function renderAll() { renderHero(); renderTop(); renderFilters(); renderCal(); renderDay(); if (openId) fillEvent(EVENTS.find(e => e.id === openId)); }

// ---------- event dialog
let openId = null;
const eventDlg = document.getElementById("eventDlg");
function pick(kind, label) {
  const ls = kind === "artists" ? labelsOf(label) : [];
  return h("button", { class: "pick", "aria-pressed": String(has(kind, label)), title: ls.length ? `${ls.join(", ")} からリリースあり` : null, onclick: () => toggle(kind, label) },
    label, ls.length ? h("span", { class: "lb" }, `  ${ls.join(", ")}`) : null);
}
function fillEvent(e) {
  if (!e) return;
  const safeUrl = /^https?:\/\//.test(e.url || "") ? e.url : null;
  const range = e.end_date ? `${fmtDay(e.date)} – ${fmtDay(e.end_date)}` : fmtDay(e.date);
  const scroll = eventDlg.scrollTop;
  fill(document.getElementById("eventBody"),
    h("div", { class: "sub", style: `--vc:${vcolor(e.venue)}` }, h("span", { class: "sq" }), vname(e), `　${range}`, e.open ? `　OPEN ${e.open}` : ""),
    h("h3", {}, e.title),
    e.price ? h("div", { class: "sub" }, e.price) : null,
    (e.genres || []).length ? [h("h4", {}, "ジャンル"), h("div", { class: "picks" }, e.genres.map(g => pick("genres", g)))] : null,
    h("h4", {}, "出演者"),
    (e.lineup || []).length ? h("div", { class: "picks" }, e.lineup.map(a => pick("artists", a)))
      : h("div", { class: "hint" }, "出演者を読み取れませんでした（未発表の場合もあります）。"),
    h("div", { class: "hint", style: "margin-top:10px" }, "押すと★が付き、今後その出演者・ジャンルのイベントが上に出ます。"),
    e.text ? h("details", {}, h("summary", {}, "掲載情報（抜粋）"), h("pre", {}, e.text)) : null,
    h("div", { class: "foot" },
      safeUrl ? h("a", { class: "btn primary", href: safeUrl, target: "_blank", rel: "noopener noreferrer" }, "公式ページ ↗") : h("span", {}),
      h("button", { class: "btn", onclick: () => eventDlg.close() }, "閉じる")));
  eventDlg.scrollTop = scroll;
}
function openEvent(e) { openId = e.id; fillEvent(e); if (!eventDlg.open) eventDlg.showModal(); eventDlg.scrollTop = 0; }
eventDlg.addEventListener("close", () => { openId = null; });
for (const d of document.querySelectorAll("dialog")) d.addEventListener("click", ev => { if (ev.target === d) d.close(); });

// ---------- prefs dialog
const prefsDlg = document.getElementById("prefsDlg");
function topCounts(getter, kind, limit) {
  const c = new Map();
  for (const e of upcoming()) for (const x of getter(e)) { const k = norm(x); if (!c.has(k)) c.set(k, [x, 0]); c.get(k)[1]++; }
  return [...c.values()].filter(([x]) => !has(kind, x)).sort((a, b) => b[1] - a[1]).slice(0, limit);
}
function prefSection(kind, title, placeholder, suggestions) {
  const input = h("input", { placeholder, "aria-label": title });
  const add = () => { const v = input.value.trim(); if (v && !has(kind, v)) { toggle(kind, v); fillPrefs(); } input.value = ""; };
  input.addEventListener("keydown", ev => { if (ev.key === "Enter" && !ev.isComposing) { ev.preventDefault(); add(); } });
  const mine = state.prefs[kind].filter(v => !(kind === "artists" && isFollowed(v)));
  const fixed = kind === "artists" ? FOLLOW.artists : [];
  return [
    h("h4", {}, title),
    h("div", { class: "addrow" }, input, h("button", { class: "btn", onclick: add }, "追加")),
    h("div", { class: "picks" },
      fixed.map(v => h("span", { class: "pick locked", "aria-pressed": "true", title: "常時フォロー（管理者が登録）" }, v)),
      mine.map(v => h("button", { class: "pick", "aria-pressed": "true", title: "押すと外す", onclick: () => { toggle(kind, v); fillPrefs(); } }, v)),
      !fixed.length && !mine.length ? h("span", { class: "hint" }, "未登録") : null),
    suggestions && suggestions.length ? h("div", { class: "picks sugg" }, h("span", { class: "hint" }, "今後の出演が多い順："),
      suggestions.map(([v, n]) => h("button", { class: "pick", onclick: () => { toggle(kind, v); fillPrefs(); } }, `${v} ×${n}`))) : null,
  ];
}
function fillPrefs() {
  const ta = h("textarea", { class: "code", "aria-label": "好みデータ(JSON)" });
  ta.value = JSON.stringify(state.prefs);
  const msg = h("span", { class: "hint" });
  fill(document.getElementById("prefsBody"),
    h("h3", {}, "好みを設定"),
    h("div", { class: "hint" }, "一致したイベントが「あなた向け」とカレンダーで強調されます。このブラウザにだけ保存されます。"),
    prefSection("artists", "アーティスト", "例: DJ Nobu", topCounts(e => e.lineup || [], "artists", 14)),
    h("h4", {}, "レーベル（所属アーティストごと追う）"),
    h("div", { class: "picks" }, FOLLOW.labels.length
      ? FOLLOW.labels.map(l => h("span", { class: "pick label" }, l, h("span", { class: "lb" }, `  ${((DATA.labels || {})[l] || []).length}組`)))
      : h("span", { class: "hint" }, "未登録")),
    h("div", { class: "hint", style: "margin-top:8px" }, "レーベルと常時フォローの追加は「追加リクエスト」から送ってください。"),
    prefSection("keywords", "パーティー名などのキーワード", "例: BLACK SMOKER / りんご音楽祭", null),
    prefSection("genres", "ジャンル", "例: Techno", topCounts(e => e.genres || [], "genres", 16)),
    h("details", {}, h("summary", {}, "別の端末に移す（書き出し・読み込み）"),
      h("div", { class: "hint", style: "margin:8px 0" }, "下の文字列をコピーし、別の端末のこの欄に貼り付けて「読み込む」を押してください。"),
      ta,
      h("div", { class: "foot", style: "margin-top:8px" }, msg, h("button", { class: "btn", onclick: () => {
        try {
          const j = JSON.parse(ta.value);
          for (const k of ["artists", "keywords", "genres"]) state.prefs[k] = Array.isArray(j[k]) ? j[k].map(String) : [];
          save(); computeMatches(); renderAll(); fillPrefs();
        } catch (_) { msg.textContent = "読み込めませんでした（形式が正しくありません）。"; }
      } }, "読み込む"))),
    h("div", { class: "foot" }, h("span", {}), h("button", { class: "btn primary", onclick: () => prefsDlg.close() }, "完了")));
}
document.getElementById("openPrefs").addEventListener("click", () => { fillPrefs(); prefsDlg.showModal(); });

// ---------- request dialog（その場では何も追加しない。文面を作って管理者に送るだけ）
const reqDlg = document.getElementById("reqDlg");
function fillReq() {
  const kinds = ["アーティスト", "レーベル", "箱・会場", "その他"];
  let kind = kinds[0];
  const radios = h("div", { class: "radios" });
  const drawRadios = () => fill(radios, kinds.map(k => h("button", { class: "pick", "aria-pressed": String(k === kind), onclick: () => { kind = k; drawRadios(); } }, k)));
  drawRadios();
  const body = h("textarea", { placeholder: "例: Squarepusher を追ってほしい / VENT を追加してほしい（URLがあれば一緒に）", "aria-label": "内容" });
  const who = h("input", { placeholder: "任意", "aria-label": "名前" });
  const msg = h("div", { class: "hint", style: "margin-top:10px", role: "status" });
  const send = async () => {
    const text = body.value.trim();
    if (!text) { msg.textContent = "内容を入力してください。"; body.focus(); return; }
    const out = `【Club Calendar 追加リクエスト】\n種類: ${kind}\n内容: ${text}${who.value.trim() ? `\n名前: ${who.value.trim()}` : ""}`;
    try {
      if (navigator.share) { await navigator.share({ text: out }); msg.textContent = "共有メニューから管理者に送ってください。"; return; }
    } catch (err) { if (err && err.name === "AbortError") return; }
    try { await navigator.clipboard.writeText(out); msg.textContent = "文面をコピーしました。LINEなどで管理者に貼り付けて送ってください。"; }
    catch (_) { fill(msg, "コピーできませんでした。下の文面を選択してコピーしてください。", h("pre", {}, out)); }
  };
  fill(document.getElementById("reqBody"),
    h("h3", {}, "追加リクエスト"),
    h("div", { class: "hint" }, "追ってほしいアーティスト・レーベル・箱を送れます。ここでは追加されず、管理者が確認してから反映します。"),
    h("div", { class: "field" }, h("label", {}, "種類"), radios),
    h("div", { class: "field" }, h("label", {}, "内容"), body),
    h("div", { class: "field" }, h("label", {}, "名前"), who),
    msg,
    h("div", { class: "foot" }, h("button", { class: "btn", onclick: () => reqDlg.close() }, "閉じる"), h("button", { class: "btn primary", onclick: send }, "文面を作って送る")));
}
document.getElementById("openReq").addEventListener("click", () => { fillReq(); reqDlg.showModal(); });

// ---------- header / navigation
function shiftMonth(n) { const [y, m] = state.month.split("-").map(Number); const d = new Date(y, m - 1 + n, 1); state.month = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; renderCal(); }
document.getElementById("prev").addEventListener("click", () => shiftMonth(-1));
document.getElementById("next").addEventListener("click", () => shiftMonth(1));
document.getElementById("todayBtn").addEventListener("click", () => { state.month = TODAY.slice(0, 7); state.sel = TODAY; renderCal(); renderDay(); });

(function header() {
  const up = document.getElementById("updated");
  if (!window.CLUB_DATA) {
    document.getElementById("warnings").append(h("div", { class: "warn" }, "data/events.js が見つかりません。先に python3 scrape.py を実行してください。"));
    return;
  }
  up.textContent = `${String(DATA.updated).replace("T", " ").slice(5, 16)} 更新`;
  for (const [v, s] of Object.entries(DATA.sources || {})) {
    if (s && s.ok === false) document.getElementById("warnings").append(
      h("div", { class: "warn" }, `${(VENUES[v] || {}).name || v} の取得に失敗しています（前回取得分を表示中）: ${s.error || ""}`));
  }
})();

computeMatches();
renderAll();
</script>
</body>
