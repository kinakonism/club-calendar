<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#04050c">
<title>Club Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #04050c; --panel: #0a0d18; --panel-2: #111729; --line: #1c2742;
  --text: #e6f0ff; --muted: #7b8aab; --accent: #00f0ff; --accent-ink: #00161a; --accent-hi: #8afbff; --hot: #ff2bd6;
  --asia: #ff2e88; --circus: #ffb000; --zero: #8f7bff; --womb: #39ff88; --vent: #ff7a3d; --dommune: #f2f2f2; --live: #7b8aab; --rdc: #c8ff5a; --other: #b79cff;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --rainbow: linear-gradient(100deg, #ff5a6e, #ffb020, #f2ff5a, #6dff8f, #5ad2ff, #b98aff);
  --display: "Anton", "Impact", "Hiragino Sans", "Noto Sans JP", sans-serif;
  --body: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Segoe UI", sans-serif;
  --radius: 6px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--bg); }
body { margin: 0; background: transparent; position: relative; z-index: 0; color: var(--text); font: 15px/1.55 var(--body); overflow-x: hidden; }
/* グリッド線＋ネオンのにじみ、その上に走査線 */
body::before {
  content: ""; position: fixed; inset: 0; z-index: -2; pointer-events: none;
  background:
    radial-gradient(58vw 44vh at 6% -10%, rgba(255, 43, 214, .26), transparent 70%),
    radial-gradient(56vw 42vh at 98% -6%, rgba(0, 240, 255, .24), transparent 70%),
    radial-gradient(60vw 40vh at 50% 112%, rgba(143, 123, 255, .20), transparent 70%),
    linear-gradient(rgba(0, 240, 255, .055) 1px, transparent 1px) 0 0 / 100% 46px,
    linear-gradient(90deg, rgba(0, 240, 255, .055) 1px, transparent 1px) 0 0 / 46px 100%;
}
body::after {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(255, 255, 255, .028) 0 1px, transparent 1px 3px);
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
::selection { background: var(--accent); color: var(--accent-ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1160px; margin: 0 auto; padding: 0 16px 96px; }

/* ticker */
.ticker { border-bottom: 1px solid var(--line); overflow: hidden; white-space: nowrap; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); background: rgba(4, 5, 12, .7); font-family: var(--mono); }
.ticker .track { display: inline-block; padding: 7px 0; animation: slide 70s linear infinite; }
.ticker b { color: var(--accent); font-weight: 700; }
.ticker i { font-style: normal; color: var(--text); }
@keyframes slide { to { transform: translateX(-50%); } }
@media (prefers-reduced-motion: reduce) { .ticker .track { animation: none; } * { transition: none !important; } }

/* masthead */
header.top { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; padding: 34px 0 10px; }
.logo { margin: 0; font: 400 clamp(52px, 11vw, 124px)/.86 var(--display); letter-spacing: .01em; text-transform: uppercase; }
.logo span { display: block; }
.logo span:first-child { text-shadow: 3px 0 var(--hot), -3px 0 var(--accent); }
.logo .hollow { color: transparent; -webkit-text-stroke: 1.5px var(--accent); filter: drop-shadow(0 0 14px rgba(0, 240, 255, .55)); }
.kicker { font: 700 11.5px var(--mono); letter-spacing: .28em; text-transform: uppercase; color: var(--accent); text-shadow: 0 0 12px rgba(0, 240, 255, .7); }
.kicker::before { content: "// "; color: var(--hot); }
header.top .side { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; text-align: right; }
header.top .meta { color: var(--muted); font: 11.5px var(--mono); }
.btn { border: 1px solid var(--line); background: rgba(10, 13, 24, .85); border-radius: 4px; padding: 8px 16px; font-size: 13.5px; transition: border-color .15s, transform .15s, background .15s; }
.btn:hover { border-color: var(--accent); box-shadow: 0 0 16px -4px var(--accent); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 700; box-shadow: 0 0 22px -4px var(--accent); }
.btn.primary:hover { background: var(--accent-hi); }
.btn.round { width: 40px; height: 40px; padding: 0; display: inline-grid; place-items: center; font-size: 16px; }
.warn { margin: 10px 0 0; padding: 9px 13px; border: 1px solid var(--asia); border-radius: 10px; font-size: 13px; color: var(--asia); }

/* section heading */
h2 { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 46px 0 14px; font: 400 30px/1 var(--display); letter-spacing: .03em; text-transform: uppercase; }
h2 .idx { font: 700 11.5px var(--mono); letter-spacing: .12em; color: var(--hot); transform: translateY(-9px); text-shadow: 0 0 10px var(--hot); }
h2 small { font: 400 12.5px var(--body); letter-spacing: .02em; text-transform: none; color: var(--muted); }

/* hero: tonight */
.hero { margin-top: 18px; border: 1px solid rgba(0, 240, 255, .35); border-radius: 8px; overflow: hidden; background: linear-gradient(180deg, rgba(17, 23, 41, .88), rgba(10, 13, 24, .92)); box-shadow: 0 0 46px -14px rgba(0, 240, 255, .5), inset 0 0 0 1px rgba(0, 240, 255, .06); }
.hero-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; padding: 18px 20px 12px; border-bottom: 1px solid var(--line); }
.hero-head .big { font: 400 clamp(34px, 6vw, 58px)/.9 var(--display); letter-spacing: .02em; }
.hero-head .big em { font-style: normal; color: var(--accent); text-shadow: 0 0 18px rgba(0, 240, 255, .7); }
.hero-head .count { margin-left: auto; color: var(--muted); font-size: 12.5px; }
.row { display: grid; grid-template-columns: 118px minmax(0, 1fr) auto; gap: 14px; align-items: center; width: 100%; text-align: left; background: transparent; border: 0; border-bottom: 1px solid var(--line); padding: 14px 20px; transition: background .15s, padding .15s; }
.row:last-child { border-bottom: 0; }
.row:hover { background: color-mix(in srgb, var(--vc) 10%, transparent); padding-left: 26px; }
.row .v { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--vc); display: flex; align-items: center; gap: 8px; }
.row .v::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--vc); box-shadow: 0 0 12px var(--vc); flex: none; }
.row .t { font-weight: 700; font-size: 17px; line-height: 1.3; overflow-wrap: anywhere; }
.row .a { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .o { font: 400 22px/1 var(--display); letter-spacing: .03em; color: var(--muted); white-space: nowrap; }
.row.hit .t::after { content: "★"; color: var(--accent); margin-left: 8px; }
@media (max-width: 620px) {
  .row { grid-template-columns: minmax(0, 1fr) auto; row-gap: 3px; padding: 13px 16px; }
  .row .v { grid-column: 1 / -1; }
  .hero-head { padding: 16px 16px 10px; }
}

/* event cards (ticket風) */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
.card { display: grid; grid-template-columns: 70px minmax(0, 1fr); text-align: left; width: 100%; padding: 0; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; transition: transform .16s, border-color .16s, box-shadow .16s; }
.card:hover { transform: translateY(-3px); border-color: var(--vc); box-shadow: 0 14px 34px -18px var(--vc); }
.card .date { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 12px 4px; background: color-mix(in srgb, var(--vc) 13%, var(--panel)); border-right: 1px dashed color-mix(in srgb, var(--vc) 55%, transparent); }
.card .date .m, .card .date .w { font-size: 10.5px; letter-spacing: .18em; font-weight: 700; color: var(--muted); }
.card .date .d { font: 400 36px/1 var(--display); color: var(--vc); }
.card .date .d.range { font-size: 22px; }
.card.v-rdc .date .d { background: var(--rainbow); -webkit-background-clip: text; background-clip: text; color: transparent; }
.card .body { padding: 11px 13px 12px; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.card .when { font-family: var(--mono); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.card .venue { color: var(--vc); font-weight: 700; }
.card .title { font-weight: 700; font-size: 15.5px; line-height: 1.32; overflow-wrap: anywhere; }
.card .why { display: flex; flex-wrap: wrap; gap: 5px; }
.card .acts { color: var(--muted); font-size: 12.5px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.tag { font-size: 11px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.tag { border-radius: 3px; }
.tag.hit { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 700; box-shadow: 0 0 12px -2px var(--accent); }
.tag.hit.label { background: var(--hot); color: #fff; box-shadow: 0 0 12px -2px var(--hot); }
.tag.new { background: var(--text); color: var(--bg); border-color: transparent; font-weight: 700; letter-spacing: .08em; }
.empty { color: var(--muted); background: rgba(10, 13, 24, .75); border: 1px dashed var(--line); border-radius: var(--radius); padding: 18px; font-size: 14px; }
.more { margin-top: 12px; }

/* toolbar */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.toolbar .month { font: 400 38px/1 var(--display); letter-spacing: .03em; min-width: 5.2em; text-align: center; }
.toolbar .month em { font-style: normal; color: var(--accent); text-shadow: 0 0 16px rgba(0, 240, 255, .7); }
.toolbar .spacer { flex: 1; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 4px; padding: 6px 12px; font-size: 12.5px; display: inline-flex; align-items: center; gap: 7px; color: var(--muted); transition: border-color .15s, color .15s; }
.chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--vc, var(--muted)); opacity: .3; }
.chip[aria-pressed="true"] { color: var(--text); border-color: color-mix(in srgb, var(--vc, var(--muted)) 60%, var(--line)); background: color-mix(in srgb, var(--vc, var(--muted)) 9%, transparent); }
.chip[aria-pressed="true"]::before { opacity: 1; box-shadow: 0 0 10px var(--vc, transparent); }
.chip.v-rdc::before { background: var(--rainbow); }
.chip.plain::before { display: none; }
.chip.plain[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 700; }

/* calendar */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.dow { background: var(--panel); text-align: center; font-family: var(--mono); font-size: 10.5px; font-weight: 700; color: var(--muted); padding: 8px 0; letter-spacing: .2em; }
.dow.wk { color: var(--accent); }
.day { background: var(--panel); min-height: 118px; padding: 6px; display: flex; flex-direction: column; gap: 3px; min-width: 0; cursor: pointer; transition: background .12s; }
.day.wk { background: #0d1120; }
.day:hover { background: var(--panel-2); }
.day.out { background: #05070f; }
.day.out .num { opacity: .28; }
.day.past .ev { opacity: .4; }
.day.past .num { color: #3d4866; }
.day .num { font: 400 20px/1 var(--display); color: var(--muted); align-self: flex-start; padding: 2px 3px 3px; letter-spacing: .02em; }
.day.today { box-shadow: inset 0 3px 0 var(--accent), inset 0 0 30px -10px rgba(0, 240, 255, .6); }
.day.today .num { color: var(--accent); text-shadow: 0 0 12px rgba(0, 240, 255, .8); }
.day.sel { outline: 2px solid var(--accent); outline-offset: -2px; }
.day:focus-visible { outline: 2px solid var(--text); outline-offset: -2px; }
.ev { display: block; width: 100%; text-align: left; color: inherit; font-family: inherit; font-size: 11.5px; line-height: 1.3; padding: 3px 6px; border: 0; border-left: 3px solid var(--vc); border-radius: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: color-mix(in srgb, var(--vc) 17%, transparent); transition: background .12s, transform .12s; }
.ev:hover { background: color-mix(in srgb, var(--vc) 38%, transparent); transform: translateX(2px); }
.ev.hit { background: var(--accent); color: var(--accent-ink); font-weight: 700; border-left-color: var(--accent-ink); }
.ev.hit:hover { background: var(--accent-hi); }
.day .rest { font-size: 11px; color: var(--muted); padding-left: 6px; }
.day .rest:hover { color: var(--text); }
.dots { display: none; flex-wrap: wrap; gap: 3px; padding: 2px 2px; justify-content: center; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--vc); }
.dot.hit { background: var(--accent); box-shadow: 0 0 0 2px var(--panel), 0 0 0 3px var(--accent); }
@media (max-width: 760px) {
  .day { min-height: 62px; padding: 5px 2px; align-items: center; }
  .day .num { align-self: center; font-size: 18px; }
  .ev, .day .rest { display: none; }
  .dots { display: flex; }
  .toolbar .month { font-size: 30px; }
  h2 { font-size: 26px; margin-top: 38px; }
}

/* dialogs */
dialog { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 8px; padding: 0; width: min(660px, calc(100vw - 24px)); max-height: calc(100dvh - 32px); box-shadow: 0 30px 90px -20px rgba(0, 0, 0, .9), 0 0 60px -18px var(--accent); }
dialog[open] { animation: pop .22s cubic-bezier(.2, .9, .3, 1.2); }
dialog::backdrop { background: rgba(2, 3, 9, .76); backdrop-filter: blur(6px); }
@keyframes pop { from { opacity: 0; transform: translateY(14px) scale(.98); } }
.dlg-head { position: relative; padding: 22px 60px 18px 22px; background: linear-gradient(135deg, color-mix(in srgb, var(--vc, var(--accent)) 34%, var(--panel)), var(--panel) 72%); border-bottom: 1px solid var(--line); }
.dlg-head .sub { font-family: var(--mono); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--text); opacity: .85; }
.dlg-head .sub .venue { color: var(--vc); font-weight: 700; }
.dlg-head h3 { margin: 8px 0 0; font-size: clamp(22px, 4.4vw, 30px); line-height: 1.2; font-weight: 700; overflow-wrap: anywhere; }
.dlg-head .price { margin-top: 8px; color: var(--muted); font-size: 13px; }
.x { position: absolute; top: 14px; right: 14px; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: rgba(4, 5, 12, .5); font-size: 18px; line-height: 1; }
.x:hover { border-color: var(--text); }
.dlg { padding: 6px 22px 22px; }
.dlg h4 { font-size: 11px; letter-spacing: .2em; color: var(--muted); margin: 20px 0 9px; text-transform: uppercase; }
.picks { display: flex; flex-wrap: wrap; gap: 6px; }
.pick { border: 1px solid var(--line); background: transparent; border-radius: 4px; padding: 5px 12px; font-size: 13.5px; max-width: 100%; overflow-wrap: anywhere; text-align: left; transition: border-color .12s, background .12s; }
.pick:hover { border-color: var(--accent); }
.pick[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 700; box-shadow: 0 0 14px -3px var(--accent); }
.pick.locked { cursor: default; }
.pick.label { border-color: var(--hot); color: var(--text); cursor: default; }
.pick[aria-pressed="true"]::before { content: "★ "; }
.dlg pre { white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; font-size: 13px; color: var(--muted); background: var(--panel-2); border-radius: 12px; padding: 12px; margin: 8px 0 0; max-height: 260px; overflow: auto; }
.dlg details summary { cursor: pointer; color: var(--muted); font-size: 13px; margin-top: 18px; }
.dlg .foot { display: flex; gap: 8px; justify-content: space-between; align-items: center; margin-top: 22px; flex-wrap: wrap; }
.hint { color: var(--muted); font-size: 12.5px; }
.addrow { display: flex; gap: 6px; margin-bottom: 8px; }
.addrow input, .dlg textarea { flex: 1; min-width: 0; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 11px; }
.dlg textarea { width: 100%; min-height: 90px; font: 12px/1.4 ui-monospace, Menlo, monospace; }
.sugg { margin-top: 8px; }
.sugg .pick { font-size: 12.5px; padding: 2px 9px; color: var(--muted); }
@media (max-width: 560px) {
  dialog { width: 100vw; max-width: 100vw; margin: auto 0 0; border-radius: 10px 10px 0 0; border-width: 1px 0 0; max-height: 88dvh; }
  @keyframes pop { from { transform: translateY(40px); opacity: 0; } }
  header.top .side { margin-left: 0; align-items: flex-start; text-align: left; }
}
footer { margin-top: 60px; color: var(--muted); font-size: 11.5px; letter-spacing: .04em; border-top: 1px solid var(--line); padding-top: 16px; }

/* ---- 飾りを外す（走査線・色ずれ・発光文字） ---- */
body::after { display: none; }
.kicker::before { content: none; }
.kicker, .hero-head .big em, .toolbar .month em, .day.today .num { text-shadow: none; }
.logo { font-size: clamp(40px, 7vw, 84px); }
.logo span:first-child { text-shadow: none; }
.logo .hollow { filter: none; }
h2 { font: 700 18px/1.3 var(--body); text-transform: none; letter-spacing: .02em; margin: 40px 0 12px; }
header.top nav { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.toolbar .nav { display: flex; gap: 8px; align-items: center; }
.filters { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; margin-bottom: 12px; }
.filters .grp { color: var(--muted); font-size: 12px; }
.sq { display: inline-block; width: 8px; height: 8px; background: var(--vc, var(--other)); margin-right: 7px; }
.dlg { padding: 20px 22px 22px; }
.dlg h3 { margin: 8px 0 4px; font-size: clamp(20px, 4vw, 26px); line-height: 1.25; overflow-wrap: anywhere; }
.dlg .sub { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.pick .lb { color: var(--hot); font-size: 11.5px; font-weight: 700; }
.pick[aria-pressed="true"] .lb { color: var(--accent-ink); }
.roster { margin-top: 10px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel-2); }
.roster .names { margin-top: 10px; max-height: 220px; overflow-y: auto; font-size: 13px; line-height: 1.8; color: var(--muted); overflow-wrap: anywhere; }
.pick.label[aria-expanded="true"] { border-color: var(--accent); }
button.pick.label { cursor: pointer; }
.roster .pick[aria-pressed="true"]::before { content: none; }
.act { display: inline-flex; align-items: stretch; border: 1px solid var(--line); border-radius: 4px; max-width: 100%; overflow: hidden; }
.act a { padding: 5px 4px 5px 12px; font-size: 13.5px; color: var(--text); text-decoration: none; overflow-wrap: anywhere; }
.act a:hover { text-decoration: underline; }
.act button { border: 0; background: transparent; color: var(--muted); padding: 0 11px 0 7px; font-size: 16px; line-height: 1; min-width: 36px; }
.act button:hover { color: var(--accent); }
.act.on { border-color: var(--accent); }
.act.on button { color: var(--accent); }
.act .lb { color: var(--hot); font-size: 11.5px; font-weight: 700; }
.tag.mark { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 700; }
.tag.mark.maybe { background: transparent; color: var(--accent); border-color: var(--accent); }
.ev.mark { outline: 2px solid var(--accent); outline-offset: -2px; }
.dot.mark { box-shadow: 0 0 0 2px var(--accent); }
.pick.markbtn[aria-pressed="true"]::before { content: "✓ "; }
.pick.link { color: var(--muted); text-decoration: none; display: inline-flex; align-items: center; }
.pick.link:hover { color: var(--text); }
.field { margin-top: 14px; }
.radios .pick[aria-pressed="true"]::before { content: none; }
.act a { padding-top: 8px; padding-bottom: 8px; }
.act button { min-width: 42px; }
/* iOS は 16px 未満の入力欄にフォーカスすると画面を拡大してしまう */
@media (max-width: 700px) { input, textarea, select { font-size: 16px !important; } }
.field .btn { white-space: nowrap; flex: none; }
.field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
.field input, .dlg textarea { width: 100%; background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 8px 11px; }
.dlg textarea:not(.code) { font: inherit; min-height: 100px; resize: vertical; }
.radios { display: flex; flex-wrap: wrap; gap: 6px; }
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
@media (max-width: 560px) { header.top nav { justify-content: flex-start; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="kicker">Tokyo night schedule</div>
      <h1 class="logo"><span>Club</span><span class="hollow">Calendar</span></h1>
    </div>
    <div class="side">
      <nav>

    h("h4", {}, "端末間で同期"),

    if (!text) { note("内容を入力してください。", true); body.focus(); return; }
    const out = `【Club Calendar 追加リクエスト】\n種類: ${kind}\n内容: ${text}${name ? `\n名前: ${name}` : ""}`;
    shareBtn.onclick = () => share(out);
    if (!REQUEST_ENDPOINT) { share(out); return; }
    busy = true; sendBtn.disabled = true; sendBtn.textContent = "送信中…"; sendBtn.style.opacity = ".6";
    note("送信しています。数秒〜30秒ほどかかることがあります。このままお待ちください。");
    // Apps Script はたまに応答が返ってこないことがあるので、10秒で打ち切って同じ送信IDで送り直す（サーバー側で重複は捨てる）
    const id = (crypto.randomUUID && crypto.randomUUID()) || String(Date.now()) + Math.random().toString(36).slice(2);
    let j = null, failed = false;
    for (let attempt = 1; attempt <= 3 && !j; attempt++) {
      if (attempt > 1) note(`応答待ちのため送り直しています（${attempt}/3）。このままお待ちください。`);
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), 10000);
      try {
        // text/plain にするとプリフライトなしで Apps Script に届く
        const res = await fetch(REQUEST_ENDPOINT, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, signal: ctl.signal,
          body: JSON.stringify({ id, kind, text, name, website: trap.value }) });
        j = await res.json(); failed = false;
      } catch (_) { failed = true; }
      clearTimeout(timer);
    }
    busy = false; sendBtn.disabled = false; sendBtn.textContent = "送信"; sendBtn.style.opacity = "";
    if (j && j.ok) { done(text, name); return; }
    if (j && j.error === "busy") { note("本日の受付上限に達しました。明日もう一度お試しください。", true); return; }
    note(failed ? "送信できたか確認できませんでした。少し待ってからもう一度「送信」を押すか、「文面を共有する」で直接送ってください。"
                : "送信できませんでした。もう一度試すか、「文面を共有する」で直接送ってください。", true);
    shareBtn.hidden = false;
  };
  sendBtn.addEventListener("click", send);
  fill(document.getElementById("reqBody"),
    h("h3", {}, "追加リクエスト"),
    h("div", { class: "hint" }, "追ってほしいアーティスト・レーベル・箱を送れます。ここでは追加されず、管理者が確認してから反映します。"),
    h("div", { class: "field" }, h("label", {}, "種類"), radios),
    h("div", { class: "field" }, h("label", {}, "内容"), body),
    h("div", { class: "field" }, h("label", {}, "名前"), who),
    trap, msg,
    h("div", { class: "foot" }, h("button", { class: "btn", onclick: () => reqDlg.close() }, "閉じる"), h("span", { style: "display:flex;gap:8px" }, shareBtn, sendBtn)));
}
document.getElementById("openReq").addEventListener("click", () => { fillReq(); reqDlg.showModal(); });

// ---------- header / navigation
function shiftMonth(n) { const [y, m] = state.month.split("-").map(Number); const d = new Date(y, m - 1 + n, 1); state.month = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; renderCal(); }
document.getElementById("prev").addEventListener("click", () => shiftMonth(-1));
document.getElementById("next").addEventListener("click", () => shiftMonth(1));
document.getElementById("todayBtn").addEventListener("click", () => { state.month = TODAY.slice(0, 7); state.sel = TODAY; renderCal(); renderDay(); });

(function header() {
  const up = document.getElementById("updated");
  if (!window.CLUB_DATA) {
    document.getElementById("warnings").append(h("div", { class: "warn" }, "data/events.js が見つかりません。先に python3 scrape.py を実行してください。"));
    return;
  }
  up.textContent = `最終更新 ${String(DATA.updated).replace("T", " ").slice(0, 16)} ・ 今後 ${upcoming().length} 件`;
  for (const [v, s] of Object.entries(DATA.sources || {})) {
    if (s && s.ok === false) document.getElementById("warnings").append(
      h("div", { class: "warn" }, `${(VENUES[v] || {}).name || v} の取得に失敗しています（前回取得分を表示中）: ${s.error || ""}`));
  }
})();

computeMatches();
renderAll();
if (sync) pullPrefs(false);
</script>
